plugins {
	id "java-platform"
}

javaPlatform {
	allowDependencies()
}

dependencies {
	// 强制引用内部维护的 Spring Framework BOM 补丁版本
	api platform("cn.bjca.footstone.bpring:bjca-footstone-bpring-framework-bom:$springFrameworkVersion")
	// 强制引用内部维护的 Spring Security BOM 补丁版本
	api platform("cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-bom:$springSecurityVersion")
	api platform("com.fasterxml.jackson:jackson-bom:2.14.3")
	constraints {
		api "com.nimbusds:nimbus-jose-jwt:10.8"
		api "javax.servlet:javax.servlet-api:4.0.1"
		api "org.junit.jupiter:junit-jupiter:5.9.3"
		api "org.assertj:assertj-core:3.23.1"
		api "org.mockito:mockito-core:4.8.1"
		api "com.squareup.okhttp3:mockwebserver:4.10.0"
		api "com.squareup.okhttp3:okhttp:4.10.0"
		api "com.jayway.jsonpath:json-path:2.7.0"
		api "org.hsqldb:hsqldb:2.5.2"
	}
}

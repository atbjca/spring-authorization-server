pluginManagement {
	repositories {
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
		gradlePluginPortal()
		maven { url 'https://repo.spring.io/release' }
	}
}

plugins {
	id "com.gradle.enterprise" version "3.10.2"
	id "io.spring.ge.conventions" version "0.0.13"
}

dependencyResolutionManagement {
	repositories {
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
		mavenCentral()
	}
}

rootProject.name = "spring-authorization-server"

def buildFiles = fileTree(rootDir) {
	def excludes = gradle.startParameter.projectProperties.get("excludeProjects")?.split(",")
	include "**/*.gradle", "**/*.gradle.kts"
	exclude "build", "**/gradle", "settings.gradle", "buildSrc", "/build.gradle", ".*", "out"
	if (excludes) {
		exclude excludes
	}
}

buildFiles.forEach { buildFile ->
	def isDefaultName = buildFile.name == "build.gradle" || buildFile.name == "build.gradle.kts"
	def isKotlin = buildFile.name.endsWith ".kts"
	def projectName
	def projectPath
	if (isDefaultName) {
		def buildFilePath = buildFile.parentFile.absolutePath
		projectPath = buildFilePath.replace((String) rootDir.absolutePath, "").replace(File.separator, ":")
		include projectPath
		projectName = findProject(projectPath).name
	} else {
		if (isKotlin) {
			projectName = buildFile.name.replace(".gradle.kts", "")
		} else {
			projectName = buildFile.name.replace(".gradle", "")
		}
		projectPath = ":$projectName"
		include projectPath
	}

	// SCA 规避核心逻辑：动态修改子项目在 Gradle 中的名称，从而影响生成的 Maven ArtifactId
	def proj = findProject(projectPath)
	if (proj && proj != rootProject) {
		def newName = projectName
		// 规则：如果原名以 "spring-security-" 开头，则截断该前缀以符合新的 artifactId 命名约定
		if (newName.startsWith("spring-security-")) {
			newName = newName.substring("spring-security-".length())
		}
		// 统一添加内部前缀，确保生成的 POM 文件中 artifactId 转为 bjca-footstone-bpring-security-...
		proj.name = "bjca-footstone-bpring-security-" + newName
		
		// 对于非标准结构的模块（如指定了 buildFileName），恢复其项目目录和构建文件配置
		if (!isDefaultName) {
			proj.projectDir = buildFile.parentFile
			proj.buildFileName = buildFile.name
		}
	}
}

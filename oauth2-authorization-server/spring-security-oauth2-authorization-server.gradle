plugins {
	id "io.spring.convention.spring-module"
}

dependencies {
	// 内部项目依赖引用：由于根项目的 settings.gradle 修改了 artifactId，此处必须同步使用重命名后的完整项目路径
	management platform(project(":bjca-footstone-bpring-security-spring-authorization-server-dependencies"))

	// 批量替换为内部补丁版本坐标，确保编译和运行时均使用已修复漏洞的本地制品
	api "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-config"
	api "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-web"
	api "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-oauth2-core"
	api "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-oauth2-jose"
	api "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-oauth2-resource-server"
	// 强制引用内部维护的 Spring Framework BOM 补丁版本
	api platform("cn.bjca.footstone.bpring:bjca-footstone-bpring-framework-bom:$springFrameworkVersion")
	// 强制引用内部维护的 Spring Security BOM 补丁版本
	api platform("cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-bom:$springSecurityVersion")
	api("cn.bjca.footstone.bpring:bjca-footstone-bpring-core") {
		exclude group: "commons-logging", module: "commons-logging"
	}
	api "com.nimbusds:nimbus-jose-jwt"
	api "com.fasterxml.jackson.core:jackson-databind"

	optional "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
	optional "cn.bjca.footstone.bpring:bjca-footstone-bpring-jdbc"

	testImplementation "cn.bjca.footstone.bpring.security:bjca-footstone-bpring-security-test"
	testImplementation "cn.bjca.footstone.bpring:bjca-footstone-bpring-webmvc"
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.mockito:mockito-core"
	testImplementation "com.jayway.jsonpath:json-path"
	testImplementation "com.squareup.okhttp3:mockwebserver"

	testRuntimeOnly "org.hsqldb:hsqldb"

	provided "javax.servlet:javax.servlet-api"
}
